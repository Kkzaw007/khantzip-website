<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khantzip Digital Store</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body {
            background-color: #0b1120;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* ---- Brand Logo & Name ---- */
        .brand-section { text-align: center; margin-bottom: 30px; display: none; }
        .brand-logo {
            width: 90px; height: 90px; border-radius: 50%; object-fit: cover;
            animation: pulse 2s infinite; box-shadow: 0 0 15px rgba(56, 189, 248, 0.5); margin-bottom: 10px;
        }
        .brand-name { font-size: 1.3rem; font-weight: bold; color: #38bdf8; margin: 0; }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
            50% { transform: scale(1.08); box-shadow: 0 0 25px rgba(56, 189, 248, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
        }

        h2 { margin-bottom: 20px; font-size: 1.4rem; text-align: center;}

        /* ---- Home Page Grid ---- */
        .app-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; max-width: 800px; margin: 0 auto; }
        .app-card {
            background-color: #1e293b; padding: 15px 10px; border-radius: 15px; text-align: center;
            cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.2s;
        }
        .app-card:hover { transform: translateY(-5px); }
        .app-card img { width: 65px; height: 65px; border-radius: 15px; object-fit: cover; margin-bottom: 10px; }
        .app-card p { margin: 0; font-size: 13px; font-weight: bold; }

        /* ---- Detail Page ---- */
        #detail-page { display: none; max-width: 600px; margin: 0 auto; }
        .back-btn {
            background-color: transparent; color: #cbd5e1; border: 1px solid #475569; padding: 8px 15px;
            border-radius: 20px; cursor: pointer; margin-bottom: 20px; font-weight: bold;
        }
        .detail-header { text-align: center; margin-bottom: 20px; }
        .detail-header img { width: 90px; border-radius: 20px; margin-bottom: 15px; }

        /* ---- Server / Category Selection Tabs ---- */
        .server-selection-container { margin-bottom: 25px; display: none; }
        .server-label { color: #f43f5e; font-size: 12px; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .server-tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
        .server-tabs::-webkit-scrollbar { height: 4px; }
        .server-tabs::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }

        .server-tab-btn {
            background-color: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 10px 18px;
            border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; white-space: nowrap; transition: all 0.3s ease;
        }
        .server-tab-btn.active { border-color: #10b981; color: #10b981; background-color: rgba(16, 185, 129, 0.1); }

        /* ---- Normal Pricing Cards ---- */
        .plan-card {
            background-color: #1e293b; border-radius: 12px; padding: 15px 20px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .plan-duration { font-size: 14px; font-weight: bold; color: #e2e8f0; margin: 0 0 5px 0; }
        .plan-price { font-size: 16px; font-weight: bold; color: #38bdf8; margin: 0;}
        .buy-btn {
            background-color: #0ea5e9; color: white; border: none; padding: 10px 20px;
            border-radius: 25px; cursor: pointer; font-weight: bold; transition: background 0.2s;
        }
        .buy-btn:hover { background-color: #0284c7; }

        /* ---- Movie Grid Style (၃ ခုတစ်တန်း) ---- */
        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .movie-card {
            background-color: #1e293b; border-radius: 12px; padding: 10px; text-align: center;
            display: flex; flex-direction: column; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
        .movie-card h4 { margin: 0 0 5px 0; font-size: 13px; color: #f8fafc; flex-grow: 1; }
        .movie-card p { font-size: 11px; color: #94a3b8; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .movie-btn {
            background-color: #f43f5e; color: white; border: none; padding: 8px 10px; border-radius: 20px;
            cursor: pointer; font-size: 12px; font-weight: bold; width: 100%; margin-top: auto;
        }

        .loading-text { text-align: center; color: #94a3b8; font-style: italic; margin-top: 20px;}

        @media (max-width: 500px) {
            .app-grid { grid-template-columns: repeat(2, 1fr); }
            .movie-grid { grid-template-columns: repeat(2, 1fr); }
            .plan-card { padding: 12px 15px; }
            .buy-btn { padding: 8px 15px; font-size: 13px;}
        }
    </style>
</head>
<body>

    <div id="brand-section" class="brand-section">
        <img id="brand-logo" class="brand-logo" src="" alt="Logo">
        <p id="brand-name" class="brand-name"></p>
    </div>

    <div id="home-page">
        <h2>Our Services</h2>
        <div id="loading-home" class="loading-text">Google Sheet မှ ဒေတာများ ယူနေပါသည်...</div>
        <div class="app-grid" id="category-grid"></div>
    </div>

    <div id="detail-page">
        <button class="back-btn" onclick="goBack()">← Back</button>
        <div class="detail-header">
            <img id="detail-img" src="" alt="App Logo">
            <h2 id="detail-title">App Name</h2>
        </div>
        
        <div id="server-selection-container" class="server-selection-container">
            <div class="server-label">Select Category</div>
            <div id="server-tabs" class="server-tabs"></div>
        </div>

        <div id="loading-detail" class="loading-text" style="display:none;">ဒေတာများ ယူနေပါသည်...</div>
        <div id="price-container"></div>
    </div>

    <script>
        const SHEET_ID = "13ubLHCnrnkn5e6n5DCZh5SwrHZEjCST9is-DfaenThk"; 
        let globalSheetData = []; 

        function fetchSheetRaw(gid, callback) {
            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${gid}`;
            Papa.parse(url, { download: true, header: false, complete: function(results) { callback(results.data || []); }, error: function(err) { callback([]); } });
        }

        function initApp() {
            fetchSheetRaw("0", function(data) {
                if(data.length > 0) {
                    let logoUrl = "", brandName = "";
                    data.forEach(row => {
                        if(row[0] === "main logo" && row[1]) logoUrl = row[1];
                        if(row[0] === "main Name" && row[1]) brandName = row[1];
                    });
                    if(logoUrl || brandName) {
                        document.getElementById('brand-section').style.display = 'block';
                        if(logoUrl) document.getElementById('brand-logo').src = logoUrl;
                        if(brandName) document.getElementById('brand-name').innerText = brandName;
                    }
                }
            });

            const homeGid = "972366933"; 
            fetchSheetRaw(homeGid, function(data) {
                document.getElementById('loading-home').style.display = 'none';
                const grid = document.getElementById('category-grid');
                grid.innerHTML = '';
                if (data.length <= 1) { grid.innerHTML = '<p style="text-align:center; color:#94a3b8; grid-column: span 3;">Data မရှိသေးပါ။</p>'; return; }

                for(let i = 1; i < data.length; i++) {
                    const row = data[i];
                    if(row[0] && row[1]) {
                        const card = document.createElement('div');
                        card.className = 'app-card';
                        const nextTabGid = row[2] ? row[2].trim() : "0";
                        card.onclick = () => openDetail(row[0], row[1], nextTabGid);
                        card.innerHTML = `<img src="${row[1]}" alt="${row[0]}"><p>${row[0]}</p>`;
                        grid.appendChild(card);
                    }
                }
            });
        }

        function openDetail(appName, appImage, sheetGid) {
            document.getElementById("brand-section").style.display = "none";
            document.getElementById("home-page").style.display = "none";
            document.getElementById("detail-page").style.display = "block";
            document.getElementById("detail-title").innerText = appName;
            document.getElementById("detail-img").src = appImage;
            
            const serverSelectionContainer = document.getElementById('server-selection-container');
            const serverTabs = document.getElementById('server-tabs');
            const priceContainer = document.getElementById('price-container');
            
            serverSelectionContainer.style.display = 'none';
            serverTabs.innerHTML = ''; priceContainer.innerHTML = '';
            document.getElementById('loading-detail').style.display = 'block';

            if(sheetGid === "0") {
                document.getElementById('loading-detail').style.display = 'none';
                priceContainer.innerHTML = '<p style="text-align:center; color:#94a3b8;">ဒေတာ မချိတ်ဆက်ရသေးပါ။</p>'; return;
            }

            fetchSheetRaw(sheetGid, function(data) {
                document.getElementById('loading-detail').style.display = 'none';
                if(data.length < 2) { priceContainer.innerHTML = '<p style="text-align:center; color:#94a3b8;">ယခု Server အတွက် ဈေးနှုန်းများ မတင်ရသေးပါ။</p>'; return; }

                globalSheetData = data;
                const headers = data[0]; 
                let categories = []; 

                // Google Sheet Column များကို အလိုအလျောက် စစ်ဆေးခြင်း (A1, F1, K1 စသည်တို့ကို Tab အဖြစ် ခွဲပေးမည်)
                for(let i = 0; i < headers.length; i++) {
                    let headerText = headers[i] ? headers[i].trim() : "";
                    let next1 = (i + 1 < headers.length && headers[i+1]) ? headers[i+1].trim().toLowerCase() : "";
                    
                    if(headerText && headerText.toLowerCase() !== "price" && headerText.toLowerCase() !== "picture" && headerText.toLowerCase() !== "story" && headerText.toLowerCase() !== "link" && headerText.toLowerCase() !== "next page") {
                        
                        // Normal Pricing Mode လား စစ်မည် (နောက် column က price ဖြစ်ရမည်)
                        if(next1 === "price") {
                            let next2 = (i + 2 < headers.length && headers[i+2]) ? headers[i+2].trim().toLowerCase() : "";
                            categories.push({ type: 'price', name: headerText, col1: i, col2: i+1, col3: (next2 === "next page") ? i+2 : -1 });
                        } 
                        // Movie Mode လား စစ်မည် (နောက် column က picture ဖြစ်ရမည်)
                        else if (next1 === "picture") {
                            categories.push({ type: 'movie', name: headerText, col1: i, col2: i+1, col3: i+2, col4: i+3 });
                        }
                    }
                }

                if(categories.length > 0) {
                    if(categories.length > 1) {
                        serverSelectionContainer.style.display = 'block'; 
                        categories.forEach((cat, index) => {
                            const btn = document.createElement('button');
                            btn.className = `server-tab-btn ${index === 0 ? 'active' : ''}`;
                            btn.innerHTML = index === 0 ? `✓ ${cat.name}` : cat.name;
                            btn.onclick = () => {
                                document.querySelectorAll('.server-tab-btn').forEach(b => {
                                    b.classList.remove('active'); b.innerText = b.innerText.replace('✓ ', ''); 
                                });
                                btn.classList.add('active'); btn.innerHTML = `✓ ${cat.name}`;
                                renderData(cat);
                            };
                            serverTabs.appendChild(btn);
                        });
                    }
                    renderData(categories[0]); // ပထမဆုံး Tab ကို စပြမည်
                } else {
                    priceContainer.innerHTML = '<p style="text-align:center; color:#94a3b8;">ဒေတာ ပုံစံမမှန်ကန်ပါ။</p>';
                }
            });
        }

        // လင့်ခ်များ ဖွင့်ရန် Helper Function (ဝယ်မည် / ဇာတ်ကားကြည့်မည် ကိုနှိပ်လျှင်)
        window.openLink = function(url) {
            if(url && url.trim() !== "" && url !== "undefined") {
                window.open(url, '_blank');
            } else {
                alert("Link မချိတ်ရသေးပါ / Update လုပ်နေဆဲဖြစ်ပါသည်။");
            }
        };

        function renderData(categoryData) {
            const priceContainer = document.getElementById('price-container');
            priceContainer.innerHTML = '';
            
            let items = [];
            // Sheet ထဲရှိ အချက်အလက်များအားလုံးကို ဆွဲယူခြင်း (အတို/အရှည် ပြဿနာမရှိစေရန်)
            for(let r = 1; r < globalSheetData.length; r++) {
                let rowData = globalSheetData[r];
                if (!rowData) continue;
                
                let col1Data = rowData.length > categoryData.col1 ? rowData[categoryData.col1] : "";
                let col2Data = rowData.length > categoryData.col2 ? rowData[categoryData.col2] : "";
                let col3Data = categoryData.col3 !== -1 && rowData.length > categoryData.col3 ? rowData[categoryData.col3] : "";
                let col4Data = categoryData.type === 'movie' && rowData.length > categoryData.col4 ? rowData[categoryData.col4] : "";
                
                if(col1Data && col1Data.trim() !== "") {
                    items.push({ title: col1Data, val2: col2Data, val3: col3Data, val4: col4Data });
                }
            }

            if(items.length > 0) {
                // --- ဇာတ်ကားများဖြစ်လျှင် သီးသန့် Grid ဖြင့် ပြမည် ---
                if (categoryData.type === 'movie') {
                    
                    // ✨ နောက်ဆုံးထည့်ထားသော ဇာတ်ကားကို ထိပ်ဆုံးရောက်ရန် ပြောင်းပြန်လှန်ခြင်း (Reverse Logic)
                    items.reverse(); 
                    
                    let gridDiv = document.createElement('div');
                    gridDiv.className = 'movie-grid';
                    
                    items.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'movie-card';
                        card.innerHTML = `
                            <img src="${item.val2}" alt="${item.title}" onerror="this.src='https://placehold.co/150x225/1e293b/94a3b8?text=No+Image'">
                            <h4>${item.title}</h4>
                            <p>${item.val3 || ''}</p>
                            <button class="movie-btn" onclick="openLink('${item.val4}')">ဇာတ်ကားကြည့်မည်</button>
                        `;
                        gridDiv.appendChild(card);
                    });
                    priceContainer.appendChild(gridDiv);
                } 
                // --- ရိုးရိုး ဈေးနှုန်းများဖြစ်လျှင် ---
                else {
                    items.forEach(item => {
                        if(item.val2) {
                            const planCard = document.createElement('div');
                            planCard.className = 'plan-card';
                            
                            // ✨ "ကျပ်" မပါသေးလျှင် Auto ထည့်ပေးခြင်း (Price နောက်တွင် ကျပ် ပေါ်မည်)
                            let priceText = item.val2.toString().trim();
                            if(!priceText.includes("ကျပ်") && !priceText.toLowerCase().includes("ks") && !priceText.toLowerCase().includes("kyat")) {
                                priceText += " ကျပ်";
                            }

                            planCard.innerHTML = `
                                <div class="plan-info">
                                    <p class="plan-duration">${item.title}</p>
                                    <p class="plan-price">${priceText}</p>
                                </div>
                                <button class="buy-btn" onclick="openLink('${item.val3}')">ဝယ်မည်</button>
                            `;
                            priceContainer.appendChild(planCard);
                        }
                    });
                }
            } else {
                priceContainer.innerHTML = '<p style="text-align:center; color:#94a3b8;">ယခု Server အတွက် ဈေးနှုန်းများ မတင်ရသေးပါ။</p>';
            }
        }

        function goBack() {
            document.getElementById("brand-section").style.display = "block";
            document.getElementById("home-page").style.display = "block";
            document.getElementById("detail-page").style.display = "none";
        }

        initApp();
    </script>
</body>
</html>
