<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khantzip Digital Store</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body {
            background-color: #0b1120;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h2 { margin-bottom: 20px; font-size: 1.5rem; }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        .app-card {
            background-color: #1e293b;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .app-card img {
            width: 70px;
            height: 70px;
            border-radius: 15px;
            object-fit: cover;
            margin-bottom: 10px;
        }
        .app-card p {
            margin: 0;
            font-size: 14px;
            font-weight: bold;
        }

        #detail-page {
            display: none;
            max-width: 600px;
            margin: 0 auto;
        }
        .back-btn {
            background-color: transparent;
            color: #cbd5e1;
            border: 1px solid #475569;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .detail-header { text-align: center; margin-bottom: 30px; }
        .detail-header img { width: 90px; border-radius: 20px; margin-bottom: 15px; }

        .plan-card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .plan-duration { font-size: 13px; color: #94a3b8; margin: 0 0 5px 0; }
        .plan-price { font-size: 16px; font-weight: bold; color: #38bdf8; margin: 0;}
        .buy-btn {
            background-color: #0ea5e9;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        .loading-text { text-align: center; color: #94a3b8; font-style: italic; margin-top: 20px;}

        @media (max-width: 600px) {
            .app-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <!-- Home Page -->
    <div id="home-page">
        <h2>Our Services</h2>
        <div id="loading-home" class="loading-text">Google Sheet မှ ဒေတာများ ယူနေပါသည်...</div>
        <div class="app-grid" id="category-grid"></div>
    </div>

    <!-- Detail Page -->
    <div id="detail-page">
        <button class="back-btn" onclick="goBack()">← Back</button>
        <div class="detail-header">
            <img id="detail-img" src="" alt="App Logo">
            <h2 id="detail-title">App Name</h2>
        </div>
        <div style="margin-bottom: 10px; font-weight: bold;">Pricing Plans</div>
        
        <div id="loading-detail" class="loading-text" style="display:none;">ဈေးနှုန်းများ ယူနေပါသည်...</div>
        <div id="price-list"></div>
    </div>

    <script>
        const SHEET_ID = "13ubLHCnrnkn5e6n5DCZh5SwrHzEjCST9is_DfaenThk"; 
        const telegramUsername = "Khantzip";
        let currentAppName = "";

        // Tab နာမည်အစား GID (နံပါတ်) ဖြင့် ဒေတာဆွဲယူခြင်း
        function fetchSheetDataByGid(gid, callback) {
            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${gid}`;
            Papa.parse(url, {
                download: true,
                header: true,
                complete: function(results) {
                    if(results.data && results.data.length > 0) {
                        callback(results.data);
                    } else {
                        callback([]);
                    }
                },
                error: function(err) {
                    console.error("Sheet Error:", err);
                    alert("Sheet Data ယူ၍မရပါ။");
                    callback([]);
                }
            });
        }

        function loadHome() {
            // home Tab ၏ GID ကို သုံးထားပါသည် (ပုံထဲမှ ယူထားသည်မှာ 972366933 ဖြစ်ပါသည်)
            const homeGid = "972366933"; 
            
            fetchSheetDataByGid(homeGid, function(data) {
                document.getElementById('loading-home').style.display = 'none';
                const grid = document.getElementById('category-grid');
                grid.innerHTML = '';
                
                if (data.length === 0) {
                     grid.innerHTML = '<p style="text-align:center; color:#94a3b8;">Data မရှိသေးပါ။</p>';
                     return;
                }

                data.forEach(row => {
                    if(row['Category'] && row['logo picture']) {
                        const card = document.createElement('div');
                        card.className = 'app-card';
                        
                        // နောက်စာမျက်နှာအတွက် GID သို့မဟုတ် Tab နာမည်ကို ဤနေရာတွင် ချိတ်နိုင်သည်
                        const nextTab = row['next page'] ? row['next page'].trim() : "0";
                        
                        card.onclick = () => openDetail(row['Category'], row['logo picture'], nextTab);
                        card.innerHTML = `
                            <img src="${row['logo picture']}" alt="${row['Category']}">
                            <p>${row['Category']}</p>
                        `;
                        grid.appendChild(card);
                    }
                });
            });
        }

        function openDetail(appName, appImage, sheetGid) {
            currentAppName = appName;
            document.getElementById("home-page").style.display = "none";
            document.getElementById("detail-page").style.display = "block";
            
            document.getElementById("detail-title").innerText = appName;
            document.getElementById("detail-img").src = appImage;
            
            const priceList = document.getElementById('price-list');
            priceList.innerHTML = '';
            document.getElementById('loading-detail').style.display = 'block';

            // အသေးစိတ်ပြမည့် Tab ၏ GID ဖြင့် ဒေတာဆွဲမည် (သို့မဟုတ် default 0)
            const targetGid = sheetGid !== "0" ? sheetGid : "0";

            fetchSheetDataByGid(targetGid, function(data) {
                document.getElementById('loading-detail').style.display = 'none';
                let hasPlans = false;

                if (data.length > 0) {
                    data.forEach(row => {
                        if(row['Plan'] && row['Price']) {
                            hasPlans = true;
                            const planCard = document.createElement('div');
                            planCard.className = 'plan-card';
                            planCard.innerHTML = `
                                <div class="plan-info">
                                    <p class="plan-duration">${row['Plan']}</p>
                                    <p class="plan-price">${row['Price']}</p>
                                </div>
                                <button class="buy-btn" onclick="buyViaTelegram('${row['Plan']}', '${row['Price']}')">ဝယ်မည်</button>
                            `;
                            priceList.appendChild(planCard);
                        }
                    });
                }

                if(!hasPlans) {
                    priceList.innerHTML = '<p style="text-align:center; color:#94a3b8;">ယခုရွေးချယ်မှုအတွက် ဈေးနှုန်းများ မတင်ရသေးပါ။</p>';
                }
            });
        }

        function goBack() {
            document.getElementById("home-page").style.display = "block";
            document.getElementById("detail-page").style.display = "none";
        }

        function buyViaTelegram(planDuration, planPrice) {
            const message = `မင်္ဂလာပါ၊ ${currentAppName} ဝယ်ချင်လို့ပါ။\nPlan: ${planDuration}\nPrice: ${planPrice}`;
            const telegramLink = `https://t.me/${telegramUsername}?text=${encodeURIComponent(message)}`;
            window.open(telegramLink, "_blank");
        }

        loadHome();
    </script>
</body>
</html>
