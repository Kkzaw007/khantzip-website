<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khantzip Digital Store</title>
    <!-- Google Sheet Data ဖတ်ရန်အတွက် PapaParse ကို အသုံးပြုထားပါသည် -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body {
            background-color: #0b1120;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h2 { margin-bottom: 20px; font-size: 1.5rem; }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        .app-card {
            background-color: #1e293b;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .app-card img {
            width: 70px;
            height: 70px;
            border-radius: 15px;
            object-fit: cover;
            margin-bottom: 10px;
        }
        .app-card p {
            margin: 0;
            font-size: 14px;
            font-weight: bold;
        }

        #detail-page {
            display: none;
            max-width: 600px;
            margin: 0 auto;
        }
        .back-btn {
            background-color: transparent;
            color: #cbd5e1;
            border: 1px solid #475569;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .detail-header { text-align: center; margin-bottom: 30px; }
        .detail-header img { width: 90px; border-radius: 20px; }

        .plan-card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .plan-duration { font-size: 13px; color: #94a3b8; margin: 0 0 5px 0; }
        .plan-price { font-size: 16px; font-weight: bold; color: #38bdf8; margin: 0;}
        .buy-btn {
            background-color: #0ea5e9;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Loading စာသားအတွက် Design */
        .loading-text { text-align: center; color: #94a3b8; font-style: italic; margin-top: 20px;}

        @media (max-width: 600px) {
            .app-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <!-- Home Page -->
    <div id="home-page">
        <h2>Our Services</h2>
        <div id="loading-home" class="loading-text">Google Sheet မှ ဒေတာများ ယူနေပါသည်...</div>
        <div class="app-grid" id="category-grid"></div>
    </div>

    <!-- Detail Page -->
    <div id="detail-page">
        <button class="back-btn" onclick="goBack()">← Back</button>
        <div class="detail-header">
            <img id="detail-img" src="" alt="App Logo">
            <h2 id="detail-title">App Name</h2>
        </div>
        <div style="margin-bottom: 10px; font-weight: bold;">Pricing Plans</div>
        
        <div id="loading-detail" class="loading-text" style="display:none;">ဈေးနှုန်းများ ယူနေပါသည်...</div>
        <div id="price-list"></div> <!-- Sheet က ဈေးတွေ ဒီနေရာမှာ အော်တိုပေါ်လာပါမယ် -->
    </div>

    <script>
        // *** ဤနေရာတွင် ပုံထဲမှ သင်၏ Google Sheet ID ကို ထည့်ထားပါသည် ***
        const SHEET_ID = "13ubLHCnrnkn5e6n5DCZh5SwrHzEjCST9is_DfaenThk"; 
        const telegramUsername = "Khantzip"; // Telegram Username ပြင်ရန်
        let currentAppName = "";

        // Sheet ထဲမှ ဒေတာများကို လှမ်းယူသည့် Function
        function fetchSheetData(sheetName, callback) {
            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${sheetName}`;
            Papa.parse(url, {
                download: true,
                header: true,
                complete: function(results) {
                    callback(results.data);
                },
                error: function(err) {
                    console.error("Sheet Error:", err);
                    alert("Sheet Data ယူ၍မရပါ။ 'Publish to web' လုပ်ထားခြင်း ရှိမရှိ စစ်ဆေးပါ။");
                }
            });
        }

        // ပထမစာမျက်နှာ (home tab) ကို ပြသခြင်း
        function loadHome() {
            fetchSheetData('home', function(data) {
                document.getElementById('loading-home').style.display = 'none';
                const grid = document.getElementById('category-grid');
                grid.innerHTML = '';
                
                data.forEach(row => {
                    // Category နာမည်နဲ့ ပုံရှိမှသာ ကတ်လေး ဖန်တီးမည်
                    if(row['Category'] && row['logo picture']) {
                        const card = document.createElement('div');
                        card.className = 'app-card';
                        
                        // next page tab နာမည်မရှိလျှင် Category နာမည်ကို Tab နာမည်အဖြစ် ယူမည်
                        const nextTab = row['next page'] ? row['next page'].trim() : row['Category'].trim();
                        
                        card.onclick = () => openDetail(row['Category'], row['logo picture'], nextTab);
                        card.innerHTML = `
                            <img src="${row['logo picture']}" alt="${row['Category']}">
                            <p>${row['Category']}</p>
                        `;
                        grid.appendChild(card);
                    }
                });
            });
        }

        // ဒုတိယစာမျက်နှာ (အသေးစိတ် ဈေးနှုန်းများ) ကို ပြသခြင်း
        function openDetail(appName, appImage, sheetTabName) {
            currentAppName = appName;
            document.getElementById("home-page").style.display = "none";
            document.getElementById("detail-page").style.display = "block";
            
            document.getElementById("detail-title").innerText = appName;
            document.getElementById("detail-img").src = appImage;
            
            const priceList = document.getElementById('price-list');
            priceList.innerHTML = '';
            document.getElementById('loading-detail').style.display = 'block';

            // သက်ဆိုင်ရာ Tab (ဥပမာ - mlbb) မှ Data ယူခြင်း
            fetchSheetData(sheetTabName, function(data) {
                document.getElementById('loading-detail').style.display = 'none';
                let hasPlans = false;

                data.forEach(row => {
                    // Plan နှင့် Price column ရှိမှသာ ပြမည်
                    if(row['Plan'] && row['Price']) {
                        hasPlans = true;
                        const planCard = document.createElement('div');
                        planCard.className = 'plan-card';
                        planCard.innerHTML = `
                            <div class="plan-info">
                                <p class="plan-duration">${row['Plan']}</p>
                                <p class="plan-price">${row['Price']}</p>
                            </div>
                            <button class="buy-btn" onclick="buyViaTelegram('${row['Plan']}', '${row['Price']}')">ဝယ်မည်</button>
                        `;
                        priceList.appendChild(planCard);
                    }
                });

                if(!hasPlans) {
                    priceList.innerHTML = '<p style="text-align:center; color:#94a3b8;">ယခုရွေးချယ်မှုအတွက် ဈေးနှုန်းများ မတင်ရသေးပါ။</p>';
                }
            });
        }

        function goBack() {
            document.getElementById("home-page").style.display = "block";
            document.getElementById("detail-page").style.display = "none";
        }

        function buyViaTelegram(planDuration, planPrice) {
            const message = `မင်္ဂလာပါ၊ ${currentAppName} ဝယ်ချင်လို့ပါ။\nPlan: ${planDuration}\nPrice: ${planPrice}`;
            const telegramLink = `https://t.me/${telegramUsername}?text=${encodeURIComponent(message)}`;
            window.open(telegramLink, "_blank");
        }

        // Website စပွင့်တာနဲ့ home page ကို Auto ဆွဲယူပါမည်
        loadHome();
    </script>
</body>
</html>
