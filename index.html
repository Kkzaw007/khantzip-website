<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khantzip Digital Store</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body {
            background-color: #0b1120;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* ---- Brand Logo & Name (Animated) ---- */
        .brand-section {
            text-align: center;
            margin-bottom: 30px;
            display: none; /* Data ဝင်လာမှ ပြမည် */
        }
        .brand-logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            /* သေးလိုက် ကြီးလိုက် Animation */
            animation: pulse 2s infinite; 
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
            margin-bottom: 10px;
        }
        .brand-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #38bdf8;
            margin: 0;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
            50% { transform: scale(1.08); box-shadow: 0 0 25px rgba(56, 189, 248, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
        }

        h2 { margin-bottom: 20px; font-size: 1.4rem; text-align: center;}

        /* ---- Home Page Grid ---- */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* ကွန်ပျူတာတွင် ၃ ခု */
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
        }
        .app-card {
            background-color: #1e293b;
            padding: 15px 10px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .app-card:hover { transform: translateY(-5px); }
        .app-card img {
            width: 65px;
            height: 65px;
            border-radius: 15px;
            object-fit: cover;
            margin-bottom: 10px;
        }
        .app-card p {
            margin: 0;
            font-size: 13px;
            font-weight: bold;
        }

        /* ---- Detail Page ---- */
        #detail-page {
            display: none;
            max-width: 600px;
            margin: 0 auto;
        }
        .back-btn {
            background-color: transparent;
            color: #cbd5e1;
            border: 1px solid #475569;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .detail-header { text-align: center; margin-bottom: 20px; }
        .detail-header img { width: 90px; border-radius: 20px; margin-bottom: 15px; }

        /* Sub-category Title (e.g., PUBG Global, မြန်မာ ဆာဗာ) */
        .category-title {
            color: #f8fafc;
            border-bottom: 2px solid #38bdf8;
            padding-bottom: 5px;
            margin-top: 25px;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .plan-card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .plan-duration { font-size: 14px; color: #94a3b8; margin: 0 0 5px 0; }
        .plan-price { font-size: 16px; font-weight: bold; color: #38bdf8; margin: 0;}
        .buy-btn {
            background-color: #0ea5e9;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        .loading-text { text-align: center; color: #94a3b8; font-style: italic; margin-top: 20px;}

        /* ဖုန်းနဲ့ကြည့်ရန် (Mobile Responsive) */
        @media (max-width: 500px) {
            .app-grid { grid-template-columns: repeat(2, 1fr); /* ဖုန်းဆိုရင် ၂ ခုစီ ပြမည် */ }
            .plan-card { padding: 12px 15px; }
            .buy-btn { padding: 8px 15px; font-size: 13px;}
        }
    </style>
</head>
<body>

    <!-- Logo & Name နေရာ -->
    <div id="brand-section" class="brand-section">
        <img id="brand-logo" class="brand-logo" src="" alt="Logo">
        <p id="brand-name" class="brand-name"></p>
    </div>

    <!-- Home Page -->
    <div id="home-page">
        <h2>Our Services</h2>
        <div id="loading-home" class="loading-text">Google Sheet မှ ဒေတာများ ယူနေပါသည်...</div>
        <div class="app-grid" id="category-grid"></div>
    </div>

    <!-- Detail Page -->
    <div id="detail-page">
        <button class="back-btn" onclick="goBack()">← Back</button>
        <div class="detail-header">
            <img id="detail-img" src="" alt="App Logo">
            <h2 id="detail-title">App Name</h2>
        </div>
        
        <div id="loading-detail" class="loading-text" style="display:none;">ဈေးနှုန်းများ ယူနေပါသည်...</div>
        <div id="price-container"></div>
    </div>

    <script>
        const SHEET_ID = "13ubLHCnrnkn5e6n5DCZh5SwrHZEjCST9is-DfaenThk"; 
        const telegramUsername = "Khantzip";
        let currentAppName = "";

        // Header မပါဘဲ 2D Array ပုံစံဖြင့် Data အကြမ်းဆွဲယူခြင်း (Column အခွဲများအတွက်)
        function fetchSheetRaw(gid, callback) {
            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${gid}`;
            Papa.parse(url, {
                download: true,
                header: false, // Array အနေနဲ့ ပြန်ထုတ်ပေးရန်
                complete: function(results) {
                    callback(results.data || []);
                },
                error: function(err) {
                    console.error("Sheet Error:", err);
                    callback([]);
                }
            });
        }

        // စစချင်း လုပ်ဆောင်မည့် Function
        function initApp() {
            // ၁။ Privacy Tab (GID: 0) မှ Logo နှင့် နာမည် ဆွဲယူခြင်း
            fetchSheetRaw("0", function(data) {
                if(data.length > 0) {
                    let logoUrl = "";
                    let brandName = "";
                    // Column A (Index 0) နဲ့ Column B (Index 1) ကို ရှာမည်
                    data.forEach(row => {
                        if(row[0] === "main logo" && row[1]) logoUrl = row[1];
                        if(row[0] === "main Name" && row[1]) brandName = row[1];
                    });
                    
                    if(logoUrl || brandName) {
                        document.getElementById('brand-section').style.display = 'block';
                        if(logoUrl) document.getElementById('brand-logo').src = logoUrl;
                        if(brandName) document.getElementById('brand-name').innerText = brandName;
                    }
                }
            });

            // ၂။ Home Tab (GID: 972366933) မှ App များကို ဆွဲယူခြင်း
            const homeGid = "972366933"; 
            fetchSheetRaw(homeGid, function(data) {
                document.getElementById('loading-home').style.display = 'none';
                const grid = document.getElementById('category-grid');
                grid.innerHTML = '';
                
                if (data.length <= 1) {
                     grid.innerHTML = '<p style="text-align:center; color:#94a3b8; grid-column: span 3;">Data မရှိသေးပါ။</p>';
                     return;
                }

                // ပထမကြောင်း (Index 0) က ခေါင်းစဉ်များဖြစ်၍ Index 1 မှစပါမည်
                for(let i = 1; i < data.length; i++) {
                    const row = data[i];
                    if(row[0] && row[1]) {
                        const card = document.createElement('div');
                        card.className = 'app-card';
                        
                        const nextTabGid = row[2] ? row[2].trim() : "0";
                        
                        card.onclick = () => openDetail(row[0], row[1], nextTabGid);
                        card.innerHTML = `
                            <img src="${row[1]}" alt="${row[0]}">
                            <p>${row[0]}</p>
                        `;
                        grid.appendChild(card);
                    }
                }
            });
        }

        // ဈေးနှုန်းစာမျက်နှာ ဖွင့်ခြင်း
        function openDetail(appName, appImage, sheetGid) {
            currentAppName = appName;
            document.getElementById("home-page").style.display = "none";
            document.getElementById("detail-page").style.display = "block";
            document.getElementById("detail-title").innerText = appName;
            document.getElementById("detail-img").src = appImage;
            
            const priceContainer = document.getElementById('price-container');
            priceContainer.innerHTML = '';
            document.getElementById('loading-detail').style.display = 'block';

            if(sheetGid === "0") {
                document.getElementById('loading-detail').style.display = 'none';
                priceContainer.innerHTML = '<p style="text-align:center; color:#94a3b8;">ဒေတာ မချိတ်ဆက်ရသေးပါ။</p>';
                return;
            }

            fetchSheetRaw(sheetGid, function(data) {
                document.getElementById('loading-detail').style.display = 'none';
                if(data.length < 2) {
                    priceContainer.innerHTML = '<p style="text-align:center; color:#94a3b8;">ဈေးနှုန်းများ မတင်ရသေးပါ။</p>';
                    return;
                }

                const headers = data[0]; // ပထမကြောင်းကို ခေါင်းစဉ်အဖြစ်ယူမည်
                let categories = []; 
                let hasAnyPlan = false;

                // Column များကို စစ်ဆေး၍ အမျိုးအစားခွဲ (Sub-categories) များကို ရှာဖွေခြင်း
                for(let i = 0; i < headers.length; i++) {
                    let headerText = headers[i] ? headers[i].trim() : "";
                    // Column နာမည်ရှိပြီး "price" မဟုတ်လျှင် ၎င်းကို အမျိုးအစားအမည်အဖြစ် မှတ်မည်
                    if(headerText && headerText.toLowerCase() !== "price") {
                        // ၎င်း၏ ဘေးကပ်လျက် Column သည် "price" ဖြစ်ရမည်
                        if(i + 1 < headers.length && headers[i+1] && headers[i+1].trim().toLowerCase() === "price") {
                            categories.push({
                                name: headerText,
                                planCol: i,
                                priceCol: i+1
                            });
                        }
                    }
                }

                // အကယ်၍ Sub-category များမတွေ့ပါက (ရိုးရိုး Plan / Price သာဖြစ်လျှင်)
                if (categories.length === 0 && headers[0] && headers[1]) {
                     categories.push({ name: "Plans", planCol: 0, priceCol: 1 });
                }

                // တွေ့ရှိသော အမျိုးအစားတစ်ခုစီအတွက် UI ဖန်တီးခြင်း
                categories.forEach(cat => {
                    let items = [];
                    // ဒုတိယကြောင်းမှစ၍ အောက်ဆုံးထိ ဒေတာများကို ယူမည်
                    for(let r = 1; r < data.length; r++) {
                        let plan = data[r][cat.planCol];
                        let price = data[r][cat.priceCol];
                        if(plan && price) {
                            items.push({plan: plan, price: price});
                        }
                    }

                    if(items.length > 0) {
                        hasAnyPlan = true;
                        let section = document.createElement('div');
                        
                        // "Plans" လို့ အလိုအလျောက်ပေးထားတာ မဟုတ်ရင် ခေါင်းစဉ် (Title) တပ်ပေးမည်
                        if (cat.name !== "Plans" && cat.name.toLowerCase() !== "plan" && cat.name.toLowerCase() !== "category") {
                            let secTitle = document.createElement('h3');
                            secTitle.className = 'category-title';
                            secTitle.innerText = cat.name;
                            section.appendChild(secTitle);
                        }

                        items.forEach(item => {
                            const planCard = document.createElement('div');
                            planCard.className = 'plan-card';
                            planCard.innerHTML = `
                                <div class="plan-info">
                                    <p class="plan-duration">${item.plan}</p>
                                    <p class="plan-price">${item.price}</p>
                                </div>
                                <!-- ဝယ်မည် နှိပ်လျှင် Telegram သို့ ပို့မည့် ဒေတာများ -->
                                <button class="buy-btn" onclick="buyViaTelegram('${cat.name}', '${item.plan}', '${item.price}')">ဝယ်မည်</button>
                            `;
                            section.appendChild(planCard);
                        });
                        
                        priceContainer.appendChild(section);
                    }
                });

                if(!hasAnyPlan) {
                    priceContainer.innerHTML = '<p style="text-align:center; color:#94a3b8;">ယခုရွေးချယ်မှုအတွက် ဈေးနှုန်းများ မတင်ရသေးပါ။</p>';
                }
            });
        }

        function goBack() {
            document.getElementById("home-page").style.display = "block";
            document.getElementById("detail-page").style.display = "none";
        }

        // Telegram Checkout
        function buyViaTelegram(categoryName, plan, price) {
            let message = `မင်္ဂလာပါ၊ ${currentAppName} ဝယ်ချင်လို့ပါ။\n`;
            
            // Sub-category (ဥပမာ - မြန်မာ ဆာဗာ) ရှိလျှင် ထည့်ရေးပေးမည်
            if (categoryName && categoryName !== "Plans" && categoryName.toLowerCase() !== "plan") {
                message += `Type: ${categoryName}\n`;
            }
            
            message += `Plan: ${plan}\nPrice: ${price}`;
            
            const telegramLink = `https://t.me/${telegramUsername}?text=${encodeURIComponent(message)}`;
            window.open(telegramLink, "_blank");
        }

        // Web စပွင့်တာနဲ့ အလုပ်လုပ်မည့် Function
        initApp();
    </script>
</body>
</html>
